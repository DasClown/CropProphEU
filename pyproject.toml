[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "crop-mcp"
version = "4.6.0"
description = "EU Crop Intelligence MCP Server — Yield forecasts, market value & risk analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "DasClown"},
]
keywords = ["mcp", "agriculture", "crop-yield", "eu", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Agriculture",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "yfinance>=0.2.0",
]

[project.optional-dependencies]
http = [
    "mcp[httpx]>=1.0.0",
    "starlette>=0.37",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=7.0",
    "build>=1.0",
]

[project.scripts]
crop-mcp = "crop_mcp_cli:main"

[tool.setuptools]
packages = ["crop_mcp", "crop_mcp.core", "crop_mcp.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
