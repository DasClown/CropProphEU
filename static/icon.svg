  <circle cx="72" cy="20" r="5" fill="#E91E63" opacity="0.8"/>
  <circle cx="62" cy="12" r="3" fill="#9C27B0" opacity="0.7"/>
  <circle cx="80" cy="14" r="3" fill="#2196F3" opacity="0.7"/>
  <line x1="68" y1="17" x2="72" y2="20" stroke="#E91E63" stroke-width="1.5" opacity="0.6"/>
  <line x1="72" y1="20" x2="78" y2="16" stroke="#E91E63" stroke-width="1.5" opacity="0.6"/>
