<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#g)" opacity="0.15"/>
  <!-- Wheat stalk -->
  <line x1="50" y1="85" x2="50" y2="35" stroke="#4CAF50" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Wheat head -->
