  <ellipse cx="56" cy="33" rx="3" ry="4" fill="#FFC107" transform="rotate(15 56 33)"/>
  <!-- Awn (beard) -->
  <line x1="38" y1="22" x2="32" y2="12" stroke="#FFB300" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="18" x2="50" y2="8" stroke="#FFB300" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="62" y1="22" x2="68" y2="12" stroke="#FFB300" stroke-width="1.5" stroke-linecap="round"/>
