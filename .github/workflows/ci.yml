name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install pytest pytest-cov

      - name: Download model files
        run: |
          mkdir -p models data
          # Models are tracked via Git LFS — they should be available
          # after checkout with lfs: true. If not, download from releases.
          if [ ! -f models/europe_yield_model.pkl ]; then
            echo "Warning: Model files not found. Some tests may be skipped."
          fi

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=crop_mcp --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: .coverage
          retention-days: 7
