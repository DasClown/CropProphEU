# Smithery.ai configuration
# https://smithery.ai/docs/servers/publish

startCommand:
  type: stdio
  configSchema:
    # JSON Schema defining configuration options for end-users
    type: object
    properties:
      httpMode:
        type: boolean
        default: false
        description: "Start in HTTP/SSE mode instead of stdio (for remote connectivity)"
      language:
        type: string
        default: "de"
        enum: ["de", "en"]
        description: "Output language: 'de' (German) or 'en' (English)"
    required: []
  commandFunction:
    |-
    function(config) {
      const args = [];
      if (config.httpMode) {
        args.push('--http', '--port', '8080');
      }
      if (config.language && config.language !== 'de') {
        args.push('--language', config.language);
      }
      return {
        command: 'crop-mcp',
        args: args
      };
    }
